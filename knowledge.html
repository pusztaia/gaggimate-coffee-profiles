<!doctype html>
<html lang="hu" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#191310">
<meta name="description" content="GaggiMate Coffee Profiles – espresso dial-in tudásbázis angolul és magyarul.">
<title>Tudásbázis · GaggiMate Coffee Profiles</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" href="assets/icons/icon-192.png" type="image/png">
<link rel="stylesheet" href="assets/css/theme.css">
<script>/* set the theme before first paint (theme.css defaults to the dark Roast theme) */
try{const t=localStorage.getItem("gaggimate-theme");document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");}catch(e){}
</script>
<link rel="stylesheet" href="assets/css/catalog.css">
<link rel="stylesheet" href="assets/css/site-nav.css">
</head>
<body>
<a class="skip" href="#main">Ugrás a tartalomhoz</a>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html" aria-label="GaggiMate Coffee Profiles – katalógus">
      <span class="brand-mark" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10h12v3.5a5.5 5.5 0 0 1-5.5 5.5h-1a5.5 5.5 0 0 1-5.5-5.5Z"/><path d="M16.5 11h1.25a2.5 2.5 0 0 1 0 5H16"/><path d="M3.5 21.5h15"/><path d="M8.5 3c-.8 1 .8 2 0 3.5M12.5 3c-.8 1 .8 2 0 3.5"/></svg></span>
      <span class="brand-name">Coffee Profiles <span>GaggiMate</span></span>
    </a>
    <div class="topbar-end">
      <button class="icon-btn" id="themeBtn" aria-label="Téma váltása" title="Téma váltása">◐</button>
    </div>
  </div>
</header>
<script src="assets/js/site-nav.js"></script>

<main id="main">
<div class="container">
<section class="hero">
  <div class="hero-inner">
    <div class="eyebrow">GaggiMate Coffee Profiles</div>
    <h1>Tudásbázis<span id="kbResultCount" class="result-count"></span></h1>
    <p class="lead">Espresso dial-in tudásanyag: alapok és daráló-referencia, témánként a részletes Deep reference-szel (angol). A fájlok az oldalon belül nyílnak meg, a köztük lévő kereszthivatkozásokkal együtt.</p>
    <div class="toolbar kb-toolbar"><div class="field"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m16.5 16.5 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input class="search" id="kbSearchInput" type="search" placeholder="Keresés a tudásbázisban…" autocomplete="off"></div></div>
  </div>
</section>

<section id="knowledge">
  <div id="knowledgeGroups"></div>
</section>
<div class="footer-space"></div>
</div>
</main>

<script src="assets/js/profile-common.js"></script>
<script src="assets/js/docs-data.js"></script>
<script src="assets/js/md-modal.js"></script>
<script>
"use strict";
function setTheme(theme){document.documentElement.dataset.theme=theme;try{localStorage.setItem("gaggimate-theme",theme);}catch(e){}}
function savedTheme(){try{return localStorage.getItem("gaggimate-theme");}catch(e){return null;}}
if(window.matchMedia){
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",event=>{if(!savedTheme())setTheme(event.matches?"dark":"light");});
}
document.getElementById("themeBtn").addEventListener("click",()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark"));
function knowledgeCardHTML(item){
  const index=KB_ITEMS.indexOf(item);
  const huBtn=item.fileHu?`<button class="btn kb-open-lang" data-kb="${index}" data-lang="hu">Magyarul</button>`:"";
  const refBtn=item.ref?`<button class="btn kb-open-ref" data-kb="${index}" title="${esc(item.refDescription||"")}">Deep reference</button>`:"";
  return `<article class="doc-card"><div class="doc-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${item.icon}</svg></div><h3>${esc(item.title)}</h3><p>${esc(item.description)}</p><div class="doc-card-actions"><button class="btn kb-open" data-kb="${index}">Megnyitás (EN)</button>${huBtn}${refBtn}</div></article>`;
}
function renderKnowledge(query){
  const q=(query||"").trim().toLocaleLowerCase("hu-HU");
  const groups=q
    ?KNOWLEDGE.map(g=>({group:g.group,items:g.items.filter(item=>`${item.title} ${item.description} ${item.refDescription||""}`.toLocaleLowerCase("hu-HU").includes(q))})).filter(g=>g.items.length)
    :KNOWLEDGE;
  const total=groups.reduce((sum,g)=>sum+g.items.length,0);
  document.getElementById("kbResultCount").textContent=q?`${total} találat`:"";
  document.getElementById("knowledgeGroups").innerHTML=groups.length
    ?groups.map(g=>`<div class="kb-group"><h3>${esc(g.group)}</h3><div class="docs-grid">${g.items.map(knowledgeCardHTML).join("")}</div></div>`).join("")
    :'<div class="empty">Nincs a keresésnek megfelelő tudásbázis-cikk.</div>';
}
document.addEventListener("click",event=>{
  const kb=event.target.closest(".kb-open");if(kb){const item=KB_ITEMS[Number(kb.dataset.kb)];if(item)openMarkdown(item.file,item.title);return;}
  const kbHu=event.target.closest(".kb-open-lang");if(kbHu){const item=KB_ITEMS[Number(kbHu.dataset.kb)];if(item&&item.fileHu)openMarkdown(item.fileHu,`${item.title} (magyarul)`);return;}
  const kbRef=event.target.closest(".kb-open-ref");if(kbRef){const item=KB_ITEMS[Number(kbRef.dataset.kb)];if(item&&item.ref)openMarkdown(item.ref,`${item.title} – Deep reference`);}
});
document.getElementById("kbSearchInput").addEventListener("input",event=>renderKnowledge(event.target.value));
renderKnowledge();
</script>
<script src="assets/js/pwa-register.js"></script>
</body>
</html>
