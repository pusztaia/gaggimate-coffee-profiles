<!doctype html>
<html lang="hu" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#191310">
<meta name="description" content="GaggiMate Profile Finder – determinisztikus kiindulópont-javaslat egy ismeretlen kávéhoz feldolgozás, pörkölés és csésze-stílus alapján.">
<title>Profile Finder · GaggiMate</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" href="assets/icons/icon-192.png" type="image/png">
<link rel="stylesheet" href="assets/css/theme.css">
<script>/* set the theme before first paint (theme.css defaults to the dark Roast theme) */
try{const t=localStorage.getItem("gaggimate-theme");document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");}catch(e){}
</script>
<style>
:root{--max:760px}
*{box-sizing:border-box}
body{margin:0;min-width:320px;background:var(--bg);color:var(--text);font-family:var(--gm-font);-webkit-font-smoothing:antialiased}
a{color:inherit}button,select{font:inherit}
.topbar{position:sticky;top:0;z-index:40;backdrop-filter:blur(18px);background:color-mix(in srgb,var(--bg) 84%,transparent);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.topbar-inner{max-width:var(--max);margin:auto;padding:.75rem 1.1rem;display:flex;align-items:center;gap:1rem}
/* Tools-style buttons come from site.css */
.icon-btn{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:.5rem .72rem;cursor:pointer}
.container{max-width:var(--max);margin:auto;padding:1.5rem 1.1rem 3rem}
h1{font-size:clamp(1.6rem,4vw,2.2rem);letter-spacing:-.03em;margin:0 0 .3rem}
.lead{color:var(--muted);margin:0 0 1.5rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-soft);padding:1.3rem}
.field-group{margin-bottom:1.2rem}
.field-group label.title{display:block;font-weight:600;font-size:.85rem;margin-bottom:.5rem}
.option-row{display:flex;flex-wrap:wrap;gap:.45rem}
.option-row label{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:.5rem .85rem;font-size:.84rem;cursor:pointer}
.option-row input{margin-right:.4rem;accent-color:var(--accent)}
.optional-row{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:.5rem}
.optional-row input{width:100%;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:var(--gm-radius-control);padding:.5rem .65rem}
.result{margin-top:2rem}
.result h2{font-size:1.2rem;margin:0 0 .8rem}
.archetype-box{border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface));border-radius:var(--radius-lg);padding:1.1rem;margin-bottom:1rem}
.archetype-box h3{margin:0 0 .3rem}
.archetype-box a.btn{display:inline-block;margin-top:.6rem}
.recipe-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem;margin:1rem 0}
.recipe-stat{background:var(--surface2);border-radius:var(--radius-md);padding:.75rem;text-align:center}
.recipe-stat strong{display:block;font-size:1.05rem}
.recipe-stat span{display:block;color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;margin-top:.15rem}
.reasoning-list{margin:0;padding-left:1.1rem}
.reasoning-list li{margin-bottom:.45rem;color:var(--text)}
.alternative-box{border:1px solid var(--line);background:var(--surface2);border-radius:var(--radius-md);padding:.9rem 1rem;margin-top:1rem}
.disclaimer{color:var(--muted);font-size:.78rem;margin-top:1rem;font-style:italic}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);text-decoration:none;border-radius:999px;padding:.65rem .95rem;cursor:pointer;font-weight:600;font-size:.84rem;display:inline-flex;align-items:center;gap:.4rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:hover{border-color:var(--accent);color:var(--accent)}
@media(max-width:480px){.recipe-grid{grid-template-columns:1fr 1fr}.optional-row{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/site-nav.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html" aria-label="GaggiMate Coffee Profiles – katalógus"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 10h12v3.5a5.5 5.5 0 0 1-5.5 5.5h-1a5.5 5.5 0 0 1-5.5-5.5Z"/><path d="M16.5 11h1.25a2.5 2.5 0 0 1 0 5H16"/><path d="M3.5 21.5h15"/><path d="M8.5 3c-.8 1 .8 2 0 3.5M12.5 3c-.8 1 .8 2 0 3.5"/></svg><span class="brand-name">Coffee Profiles <span>GaggiMate</span></span></a>
    <div class="topbar-end">
      <button class="icon-btn" id="themeBtn" aria-label="Téma váltása" title="Téma váltása">◐</button>
    </div>
  </div>
</header>
<script src="assets/js/site-nav.js"></script>
<main class="container">
  <h1>Profile Finder</h1>
  <p class="lead">Nem generál új profilt — egy már meglévő, dokumentált GaggiMate archetípust és kiindulópont-receptet ajánl egy ismeretlen kávéhoz, feldolgozás, pörkölés és kívánt csésze-stílus alapján.</p>

  <form id="finderForm" class="card">
    <div class="field-group">
      <label class="title">Pörkölési fok</label>
      <div class="option-row">
        <label><input type="radio" name="roast" value="light">Light</label>
        <label><input type="radio" name="roast" value="medium-light">Medium-light</label>
        <label><input type="radio" name="roast" value="medium" checked>Medium</label>
        <label><input type="radio" name="roast" value="medium-dark">Medium-dark</label>
        <label><input type="radio" name="roast" value="dark">Dark</label>
      </div>
    </div>
    <div class="field-group">
      <label class="title">Feldolgozás</label>
      <div class="option-row">
        <label><input type="radio" name="process" value="washed" checked>Washed</label>
        <label><input type="radio" name="process" value="natural">Natural</label>
        <label><input type="radio" name="process" value="honey">Honey</label>
        <label><input type="radio" name="process" value="anaerobic">Anaerobic</label>
        <label><input type="radio" name="process" value="other">Egyéb</label>
      </div>
    </div>
    <div class="field-group">
      <label class="title">Kávé kora</label>
      <div class="option-row">
        <label><input type="radio" name="beanAge" value="very-fresh">Nagyon friss (&lt;1 hete pörkölt)</label>
        <label><input type="radio" name="beanAge" value="rested" checked>Pihentetett (1–3 hét)</label>
        <label><input type="radio" name="beanAge" value="older">Régebbi (3+ hét)</label>
      </div>
    </div>
    <div class="field-group">
      <label class="title">Kívánt csésze-stílus</label>
      <div class="option-row">
        <label><input type="radio" name="cupStyle" value="fruity-clarity">Gyümölcsös / tiszta</label>
        <label><input type="radio" name="cupStyle" value="balanced" checked>Kiegyensúlyozott</label>
        <label><input type="radio" name="cupStyle" value="sweet">Édes</label>
        <label><input type="radio" name="cupStyle" value="body">Testes</label>
        <label><input type="radio" name="cupStyle" value="traditional">Hagyományos espresso</label>
      </div>
    </div>
    <div class="field-group">
      <label class="title">Régió (opcionális, csak natural feldolgozásnál számít)</label>
      <div class="option-row">
        <label><input type="radio" name="origin" value="africa" checked>Afrika</label>
        <label><input type="radio" name="origin" value="central-south-america">Közép-/Dél-Amerika</label>
        <label><input type="radio" name="origin" value="other">Egyéb / nem tudom</label>
      </div>
      <div class="optional-row">
        <input type="text" id="altitude" placeholder="Magasság (opcionális, m)">
        <input type="text" id="variety" placeholder="Fajta (opcionális)">
      </div>
    </div>
    <button type="submit" class="btn primary">Javaslat kérése</button>
  </form>

  <div id="resultBox" class="result" hidden>
    <h2>Javasolt kiindulópont</h2>
    <div class="archetype-box" id="primaryBox"></div>
    <div class="card">
      <div class="recipe-grid" id="recipeGrid"></div>
      <h3 style="font-size:.95rem;margin:1rem 0 .5rem">Miért ezt javasolja</h3>
      <ul class="reasoning-list" id="reasoningList"></ul>
      <div class="alternative-box" id="alternativeBox" hidden></div>
      <p class="disclaimer" id="disclaimerText"></p>
    </div>
  </div>
</main>
<script src="assets/js/finder-rules.js"></script>
<script>
"use strict";
const $=(sel,root=document)=>root.querySelector(sel);
function esc(value){return String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));}

function setTheme(theme){document.documentElement.dataset.theme=theme;localStorage.setItem("gaggimate-theme",theme);}
function preferredTheme(){
  const saved=localStorage.getItem("gaggimate-theme");
  if(saved)return saved;
  return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
}
if(window.matchMedia){
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",event=>{
    if(!localStorage.getItem("gaggimate-theme"))setTheme(event.matches?"dark":"light");
  });
}
setTheme(preferredTheme());
$("#themeBtn").addEventListener("click",()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark"));

function renderResult(result){
  $("#primaryBox").innerHTML=`<h3>${esc(result.primary.title)}</h3><p>${esc(result.primary.reason)}.</p><a class="btn primary" href="profile.html?id=${encodeURIComponent(result.primary.id)}">Profil megnyitása</a>`;
  $("#recipeGrid").innerHTML=[
    ["Dózis",`${result.recipe.doseG} g`],
    ["Hőmérséklet",result.recipe.tempRange],
    ["Főnyomás",result.recipe.pressureRange],
    ["Hozam",result.recipe.yieldRange],
    ["Arány",result.recipe.ratio],
    ["Profilidő",result.recipe.timeRange]
  ].map(([label,val])=>`<div class="recipe-stat"><strong>${esc(val)}</strong><span>${esc(label)}</span></div>`).join("");
  $("#reasoningList").innerHTML=result.reasoning.map(r=>`<li>${esc(r)}</li>`).join("");
  if(result.alternative){
    $("#alternativeBox").hidden=false;
    $("#alternativeBox").innerHTML=`<strong>Alternatíva:</strong> <a href="profile.html?id=${encodeURIComponent(result.alternative.id)}">${esc(result.alternative.title)}</a> — ${esc(result.alternative.reason)}.`;
  }else{
    $("#alternativeBox").hidden=true;
  }
  $("#disclaimerText").textContent=result.disclaimer;
  $("#resultBox").hidden=false;
  $("#resultBox").scrollIntoView({behavior:"smooth",block:"start"});
}

$("#finderForm").addEventListener("submit",event=>{
  event.preventDefault();
  const form=event.target;
  const input={
    roast:form.roast.value,
    process:form.process.value,
    beanAge:form.beanAge.value,
    cupStyle:form.cupStyle.value,
    origin:form.origin.value,
    altitude:$("#altitude").value.trim(),
    variety:$("#variety").value.trim()
  };
  renderResult(findProfileRecommendation(input));
});
</script>
<script src="assets/js/pwa-register.js"></script>
</body>
</html>
